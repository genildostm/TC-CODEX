<!doctype html>
<html lang="pt-BR"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover"><meta name="theme-color" content="#f7f7f5"><meta name="description" content="Um jeito simples de conversar com a IA."><link rel="manifest" href="manifest.webmanifest"><link rel="icon" href="icon.svg" type="image/svg+xml"><link rel="stylesheet" href="style.css"><title>TC Codex</title></head>
<body><div class="shell"><aside class="sidebar" id="sidebar"><a class="brand" href="/"><span class="brand-mark">✳</span><span>TC-Codex</span></a><button class="new-chat" id="newChat"><span>＋</span> Nova conversa</button><div class="side-caption">ACESSO RÁPIDO</div><button class="history-item active"><span>◷</span> Conversa atual</button><div class="side-bottom"><div class="api-status"><i></i><span id="connectionStatus">Pronto para conectar</span></div><p>Usa a API da OpenAI<br>e sua própria chave.</p></div></aside>
<main class="main"><header class="topbar"><button class="mobile-menu" id="menuButton" aria-label="Abrir menu">☰</button><div class="mobile-brand"><span class="brand-mark">✳</span> TC-Codex</div><div class="model-pill"><i></i> Assistente</div></header><section class="conversation" id="conversation" aria-live="polite"><div class="welcome" id="welcome"><div class="welcome-mark">✳</div><p class="kicker">SEU ASSISTENTE, A UM TOQUE</p><h1>O que vamos<br><em>resolver hoje?</em></h1><p class="welcome-copy">Pergunte, escreva, planeje ou tire uma dúvida.<br>Comece por aqui.</p><div class="suggestions"><button data-prompt="Me ajude a organizar minhas tarefas de hoje."><span>▦</span><b>Organizar meu dia</b><small>Monte um plano simples</small><i>↗</i></button><button data-prompt="Explique inteligência artificial de um jeito bem simples."><span>✧</span><b>Aprender algo novo</b><small>Uma explicação clara</small><i>↗</i></button><button data-prompt="Me ajude a escrever uma mensagem educada para resolver um problema."><span>⌁</span><b>Escrever melhor</b><small>Uma ideia para começar</small><i>↗</i></button></div></div><div class="messages" id="messages"></div></section>
<footer class="composer-wrap"><form class="composer" id="chatForm"><textarea id="prompt" rows="1" placeholder="Escreva sua mensagem..." aria-label="Sua mensagem"></textarea><button class="send" id="sendButton" type="submit" aria-label="Enviar mensagem"><span>↑</span></button></form><div class="composer-note">As respostas podem conter erros. Confira informações importantes.</div></footer></main></div><script src="app.js"></script></body></html>
